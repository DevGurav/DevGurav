name: Build profile graphics

on:
  schedule:
    # Every 6 hours. The cards only move slowly, but Actions minutes are free on public repos
    # and a shorter cycle means a bad run is corrected by the next one rather than sitting
    # on the profile for a full day.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

# Everything published to the output branch is built here in one job. Publishing replaces the
# whole branch, so a second workflow writing to it would silently delete this one's output.
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: DevGurav
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Platane/snk is a Docker action, so it runs as root and leaves dist/ owned by
      # root:root. Every step after it runs as the unprivileged runner user, which is
      # how the stat cards step came to fail with EACCES on every run for two weeks
      # while the snake step above it stayed green. Hand the directory back.
      - name: Take ownership of the output directory
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs DevGurav dist

      - name: Generate the activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-activity.mjs DevGurav dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
