name: Build profile graphics

on:
  schedule:
    # Every 6 hours. The cards only move slowly, but Actions minutes are free on public repos
    # and a shorter cycle means a bad run is corrected by the next one rather than sitting
    # on the profile for a full day.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

# Everything published to the output branch is built here in one job. Publishing replaces the
# whole branch, so a second workflow writing to it would silently delete this one's output.
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: DevGurav
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-stats.mjs DevGurav dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
